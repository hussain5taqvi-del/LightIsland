name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: "Also build the full release folder (engines, Filee) and upload it"
        type: boolean
        default: false

jobs:
  compile:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: LightIsland
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build (compile check)
        shell: pwsh
        run: |
          dotnet build LightIsland.csproj -c Release -nologo 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # show every error as one annotation (readable without opening the log)
            $errs = Select-String -Path build.log -Pattern ': error ' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique | Select-Object -First 60
            $msg = ($errs -join "%0A")
            Write-Host "::error title=Compile errors::$msg"
          }
          exit $code

  package:
    if: github.event_name == 'workflow_dispatch' && inputs.package
    needs: compile
    runs-on: windows-latest
    defaults:
      run:
        working-directory: LightIsland
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: dotnet publish LightIsland.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o release
      - name: Engines (yt-dlp, deno, Filee)
        shell: pwsh
        run: ./tools/get-engines.ps1 -Release "$PWD/release"
      - name: Smoke test (Filee CLI + yt-dlp)
        shell: pwsh
        run: |
          $out = @()
          $out += "ls: " + ((Get-ChildItem release -Name) -join ', ')
          $out += "filee: " + ((Get-ChildItem release/filee -Name | Select-Object -First 25) -join ', ')
          $out += "engines: " + ((Get-ChildItem release/filee/engines -Name -ErrorAction SilentlyContinue) -join ', ')
          $f = "release/filee/filee-cli.exe"
          $out += "--- formats jpg"
          $out += (& $f formats jpg 2>&1 | Out-String)
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 40,40
          $bmp.Save("$PWD/t.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $out += "--- convert png->webp"
          $out += (& $f convert "$PWD/t.png" --to webp --json 2>&1 | Out-String)
          $out += "exit " + $LASTEXITCODE
          $out += "--- yt-dlp"
          $out += (& release/engines/yt-dlp.exe --version 2>&1 | Out-String)
          $out += (& release/engines/deno.exe --version 2>&1 | Out-String)
          Write-Host ("::notice title=Smoke::" + (($out -join "`n") -replace "`r","" -replace "%","%25" -replace "`n","%0A"))
      - name: Sizes
        shell: pwsh
        run: |
          function Sz($p) { [math]::Round(((Get-ChildItem $p -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum)/1MB,1) }
          $o = @()
          foreach ($d in (Get-ChildItem release)) { $o += ($d.Name + ' = ' + $(if ($d.PSIsContainer) { Sz $d.FullName } else { [math]::Round($d.Length/1MB,1) }) + ' MB') }
          $o += '--- release/engines'
          foreach ($d in (Get-ChildItem release/engines)) { $o += ($d.Name + ' = ' + $(if ($d.PSIsContainer) { Sz $d.FullName } else { [math]::Round($d.Length/1MB,1) }) + ' MB') }
          $o += '--- release/filee/engines'
          foreach ($d in (Get-ChildItem release/filee/engines)) { $o += ($d.Name + ' = ' + (Sz $d.FullName) + ' MB') }
          $o += '--- release/filee biggest files'
          Get-ChildItem release/filee -File | Sort-Object Length -Descending | Select-Object -First 30 | ForEach-Object { $o += ($_.Name + ' = ' + [math]::Round($_.Length/1MB,1) + ' MB') }
          $o += '--- release/filee folders'
          foreach ($d in (Get-ChildItem release/filee -Directory)) { $o += ($d.Name + ' = ' + (Sz $d.FullName) + ' MB') }
          Write-Host ("::notice title=Sizes::" + (($o -join "`n") -replace "`r","" -replace "%","%25" -replace "`n","%0A"))
      - uses: actions/upload-artifact@v4
        with:
          name: LightIsland-release
          path: LightIsland/release

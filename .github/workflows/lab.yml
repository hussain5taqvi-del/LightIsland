name: lab

# LightIsland Lab (experimental copy). Compiles on every push that touches LightIsland.Lab.
# "Run workflow" with a version builds the portable zip + installer and publishes a PRE-RELEASE (the stable app's
# auto update only reads the latest normal release, so Lab can never be installed over a stable copy).
on:
  push:
    paths: ["LightIsland.Lab/**", ".github/workflows/lab.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Lab version, for example 2.0.0 (empty = compile only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  compile:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: LightIsland.Lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build (compile check)
        shell: pwsh
        run: |
          dotnet build LightIslandLab.csproj -c Release -nologo 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $errs = Select-String -Path build.log -Pattern ': error ' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique | Select-Object -First 60
            Write-Host "::error title=Compile errors::$($errs -join '%0A')"
          }
          exit $code

  package:
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    needs: compile
    runs-on: windows-latest
    defaults:
      run:
        working-directory: LightIsland.Lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: dotnet publish LightIslandLab.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ inputs.version }} -p:PublishReadyToRun=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o release
      - name: Engines (yt-dlp, deno, Filee)
        shell: pwsh
        run: ./tools/get-engines.ps1 -Release "$PWD/release"
      - name: Packages
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}"
          New-Item -ItemType Directory -Force out | Out-Null
          7z a -tzip -mx=5 "out/LightIslandLab-Portable-$ver.zip" "./release/*" | Out-Null
          choco install innosetup -y --no-progress | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$ver" "/DSourceDir=$PWD\release" installer\LightIslandLab.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Move-Item installer/out/LightIslandLab-Setup-$ver.exe out/
          Get-ChildItem out | ForEach-Object { Write-Host ($_.Name + " = " + [math]::Round($_.Length/1MB,1) + " MB") }
      - name: Publish pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${{ inputs.version }}"
          gh release create "lab-v$ver" --repo "${{ github.repository }}" --prerelease --title "LightIsland Lab $ver (test build)" --notes "Experimental test build. Installer or portable zip. Not the stable app." "out/LightIslandLab-Setup-$ver.exe" "out/LightIslandLab-Portable-$ver.zip"
